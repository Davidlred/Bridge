name: Bridge
options:
  bundleIdPrefix: app.thebridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    API_BASE_URL: https://api.thebridge.app
    # RevenueCat public SDK key (appl_…). Empty = the paywall shows, but purchases are switched off.
    REVENUECAT_KEY: ""
    # PostHog project key (phc_…). Empty = no analytics.
    POSTHOG_KEY: ""
  configs:
    Debug:
      API_BASE_URL: http://localhost:8080
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
  BridgeCrypto:
    path: BridgeCrypto
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
targets:
  Bridge:
    type: application
    platform: iOS
    sources: [Bridge]
    resources:
      - Bridge/Resources
    info:
      path: Bridge/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBlack
        NSCameraUsageDescription: Take a photo for your goal images. It is only used to picture your future and is never shared.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - BricolageGrotesque.ttf
          - Geist.ttf
          - GeistMono.ttf
        APIBaseURL: $(API_BASE_URL)
        RevenueCatKey: $(REVENUECAT_KEY)
        PostHogKey: $(POSTHOG_KEY)
        BGTaskSchedulerPermittedIdentifiers: [app.thebridge.sync]
        UIBackgroundModes: [fetch, remote-notification]
        ITSAppUsesNonExemptEncryption: true
    entitlements:
      path: Bridge/Bridge.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.developer.associated-domains: ["applinks:thebridge.app"]
    dependencies:
      - package: RevenueCat
      - package: BridgeCrypto
      - package: PostHog
      - package: Sentry
  BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BridgeTests]
    dependencies:
      - target: Bridge
      - package: BridgeCrypto
      - package: SnapshotTesting
schemes:
  Bridge:
    build:
      targets:
        Bridge: all
        BridgeTests: [test]
    test:
      targets: [BridgeTests]
