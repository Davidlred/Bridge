name: Bridge
options:
  bundleIdPrefix: app.thebridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    # No app icon artwork yet; add an AppIcon set to Assets.xcassets and remove this line.
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    API_BASE_URL: https://api.thebridge.app
    # From the iOS OAuth client in Google Cloud. Empty = Google sign-in reports unavailable.
    GOOGLE_IOS_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: ""
  configs:
    Debug:
      API_BASE_URL: http://localhost:8080
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
targets:
  Bridge:
    type: application
    platform: iOS
    sources: [Bridge]
    resources:
      - Bridge/Resources
    info:
      path: Bridge/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBlack
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - BricolageGrotesque.ttf
          - Geist.ttf
          - GeistMono.ttf
        APIBaseURL: $(API_BASE_URL)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        BGTaskSchedulerPermittedIdentifiers: [app.thebridge.sync]
        UIBackgroundModes: [fetch, remote-notification]
        ITSAppUsesNonExemptEncryption: true
    entitlements:
      path: Bridge/Bridge.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.developer.associated-domains: ["applinks:thebridge.app"]
    dependencies:
      - package: RevenueCat
      - package: PostHog
      - package: Sentry
      - package: GoogleSignIn
  BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BridgeTests]
    dependencies:
      - target: Bridge
      - package: SnapshotTesting
schemes:
  Bridge:
    build:
      targets:
        Bridge: all
        BridgeTests: [test]
    test:
      targets: [BridgeTests]
