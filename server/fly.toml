app = "bridge-api"
primary_region = "iad"

[build]

[deploy]
  release_command = "node dist/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # One machine: Game Night keeps each live game in that process (src/social/game.ts). Before running more, route an
  # alliance's game to one machine (fly-replay) or move game state into Redis.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
